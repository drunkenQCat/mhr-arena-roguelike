name: Build and release MHR Arena Roguelike

on:
  schedule:
    - cron: '0 20 * * *' # 04:00 Asia/Shanghai
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out mod source
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Check out REFramework fork
        uses: actions/checkout@v4
        with:
          repository: drunkenQCat/REFramework
          ref: 2e7ce5b97dce68cc742b5c80ad421213c551c803
          path: reframework-src
          submodules: recursive
          fetch-depth: 0

      - name: Record REFramework revision
        id: framework-revision
        shell: pwsh
        run: |
          "sha=$(git -C reframework-src rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore REFramework build cache
        id: framework-cache
        uses: actions/cache/restore@v4
        with:
          path: reframework-src/build
          key: windows-mhrise-ref-release-v2-${{ steps.framework-revision.outputs.sha }}
          restore-keys: |
            windows-mhrise-ref-release-v2-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mod/package-lock.json

      - name: Build mod Lua bundle
        working-directory: mod
        run: |
          npm ci
          npm run build:nocopy
          npm run typecheck
          npm test
          npm run check
          python -m pip install lupa==2.8
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install Lua runtime test dependency' }
          npm run check:runtime
          if ($LASTEXITCODE -ne 0) { throw 'Compiled Lua runtime checks failed' }
          python scripts/check-multiplayer-process.py
          if ($LASTEXITCODE -ne 0) { throw 'Cross-process Lua multiplayer protocol checks failed' }
          npm run test:cli

      - name: Build web console HTML
        working-directory: mod
        run: |
          npm --prefix console ci
          npm --prefix console run build

      - name: Build web console native plugin
        working-directory: mod
        shell: pwsh
        run: ./native/webconsole/build.ps1 -Target Plugin -Configuration Release

      - name: Test native memory and Steam bridges
        working-directory: mod
        shell: pwsh
        run: |
          cmake --build native/webconsole/.build/Plugin-Release-x64 --config Release --target bridge_lifecycle_test fake_steam steam_lobby_test instance_config_test webconsole_test
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed' }
          ctest --test-dir native/webconsole/.build/Plugin-Release-x64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
          ./native/webconsole/test-server.ps1 -BinaryDirectory native/webconsole/.build/Plugin-Release-x64/Release

      - name: Reuse verified upstream CI framework binary
        if: steps.framework-cache.outputs.cache-hit != 'true'
        id: framework-prebuilt
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Immutable successful upstream run for the pinned source above. Expired
          # artifacts or inaccessible Actions fall back to building that source.
          gh run download 40834594055 --repo drunkenQCat/REFramework --name MHRISE --dir framework-ci
          if ($LASTEXITCODE -ne 0) { throw 'Pinned framework artifact unavailable; build from source.' }
          Expand-Archive -LiteralPath framework-ci/MHRISE.zip -DestinationPath framework-ci/extracted
          $revision = (Get-Content framework-ci/extracted/reframework_revision.txt -Raw).Trim()
          if ($revision -ne '${{ steps.framework-revision.outputs.sha }}') { throw 'Framework artifact source mismatch.' }
          $hash = (Get-FileHash framework-ci/extracted/dinput8.dll -Algorithm SHA256).Hash
          if ($hash -ne 'BCB318D59FAA28B979BE26460CA8DF815D602197E2605DC6D90E4AAF1AEEDB15') { throw 'Framework artifact hash mismatch.' }
          New-Item -ItemType Directory -Force reframework-src/build/bin/MHRISE | Out-Null
          Copy-Item framework-ci/extracted/dinput8.dll reframework-src/build/bin/MHRISE/dinput8.dll
          'ready=true' >> $env:GITHUB_OUTPUT

      - name: Build REFramework for Monster Hunter Rise
        if: steps.framework-cache.outputs.cache-hit != 'true' && steps.framework-prebuilt.outputs.ready != 'true'
        shell: pwsh
        run: |
          cmake -S reframework-src -B reframework-src/build -A x64 -DDEVELOPER_MODE=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake --build reframework-src/build --config Release --target MHRISE --parallel 4

      - name: Package game-folder release
        working-directory: mod
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "nightly" }
          ./scripts/package-release.ps1 `
            -FrameworkDirectory "../reframework-src" `
            -StageDirectory "../release-stage" `
            -OutputArchive "../MHR-Arena-Roguelike-$version.zip" `
            -Version $version `
            -ModRevision "${{ github.sha }}"
          ./scripts/test-release.ps1 -Archive "../MHR-Arena-Roguelike-$version.zip"

      - name: Save REFramework build cache
        if: success() && steps.framework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: reframework-src/build
          key: windows-mhrise-ref-release-v2-${{ steps.framework-revision.outputs.sha }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHR-Arena-Roguelike-${{ github.ref_name }}
          path: MHR-Arena-Roguelike-*.zip
          if-no-files-found: error

      - name: Publish private GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: MHR Arena Roguelike ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: MHR-Arena-Roguelike-*.zip

      - name: Publish latest nightly (fixed download link)
        if: github.ref == 'refs/heads/master' && github.ref_type != 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          自动测试构建，来自提交 ${{ github.sha }}，运行 #${{ github.run_number }}。每天北京时间 04:00 和手动运行构建；测试通过后才替换此下载。

          下载 Assets 中的 MHR-Arena-Roguelike-nightly.zip，不要下载 Source code。双方先退出游戏，再安装同一份 ZIP。包内“测试与反馈.txt”有详细步骤；网页首页可一键下载测试日志。

          当前版本已接入：Steam 自动准备、原生任务板入队、局内房主选波、全端原生出怪记录确认、个人 PT 与购物。默认启用，无需 DebugMode。真实双客户端战斗同步仍需玩家验证，不能把模拟测试视为联机验收。请按包内说明测试单怪、顺序双怪、同时双怪，并下载双方日志反馈。
          "@
          Set-Content -LiteralPath nightly-notes.md -Value $notes -Encoding utf8
          gh release view nightly --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH 'repos/${{ github.repository }}/git/refs/tags/nightly' -f 'sha=${{ github.sha }}' -F force=true
            if ($LASTEXITCODE -ne 0) { throw 'Cannot update nightly tag' }
            gh release edit nightly --repo '${{ github.repository }}' --title 'Nightly — 联机多波次实验版' --prerelease --notes-file nightly-notes.md
          } else {
            gh release create nightly --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'Nightly — 联机多波次实验版' --prerelease --notes-file nightly-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish nightly release' }
          gh release upload nightly MHR-Arena-Roguelike-nightly.zip --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload nightly archive' }
